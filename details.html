<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ani3Lix - Details</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 15px;
        }
        .btn-back {
            background-color: var(--tg-theme-secondary-bg-color, #333);
            color: var(--tg-theme-text-color, #fff);
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }
        .details-header {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .details-cover {
            width: 120px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .details-info h2 {
            margin: 0 0 5px 0;
            font-size: 20px;
        }
        .details-genres {
            color: #ff4757;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .details-synopsis {
            font-size: 13px;
            color: #ccc;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 6;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .ad-banner {
            background-color: var(--tg-theme-secondary-bg-color, #2a2a2a);
            color: #777;
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            border-radius: 8px;
            font-size: 12px;
            border: 1px dashed #555;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin: 20px 0 10px 0;
            border-left: 4px solid #ff4757;
            padding-left: 8px;
        }
        .episode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 10px;
        }
        .ep-btn {
            background-color: var(--tg-theme-secondary-bg-color, #1e1e1e);
            color: var(--tg-theme-text-color, #fff);
            border: 1px solid #444;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-back">← Back to Home</a>
    
    <div class="details-header">
        <img id="detail-img" class="details-cover" src="" alt="Cover" style="display:none;">
        <div class="details-info">
            <h2 id="detail-title">Loading...</h2>
            <div id="detail-genres" class="details-genres"></div>
            <div id="detail-status" style="font-size: 12px; color: #888;"></div>
        </div>
    </div>
    
    <div id="detail-synopsis" class="details-synopsis"></div>

    <div class="ad-banner">Pre-Player Ad Space</div>

    <div class="section-title">Episodes</div>
    <div class="episode-grid" id="episode-list">
        </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Parse the URL to get the exact Anime ID we passed from the home page
        const urlParams = new URLSearchParams(window.location.search);
        const animeId = urlParams.get('id');

        async function fetchDetails() {
            if (!animeId) {
                document.getElementById('detail-title').innerText = "Anime not found.";
                return;
            }

            try {
                // Fetch specific data using that ID
                const response = await fetch(`https://api.jikan.moe/v4/anime/${animeId}`);
                const data = await response.json();
                const anime = data.data;

                // Inject data into the HTML
                const imgElement = document.getElementById('detail-img');
                imgElement.src = anime.images.jpg.image_url;
                imgElement.style.display = 'block';

                document.getElementById('detail-title').innerText = anime.title;
                document.getElementById('detail-status').innerText = `${anime.status} • ${anime.year || 'N/A'}`;
                document.getElementById('detail-synopsis').innerText = anime.synopsis || "No synopsis available.";
                
                const genres = anime.genres.map(g => g.name).join(', ');
                document.getElementById('detail-genres').innerText = genres;

                const epContainer = document.getElementById('episode-list');
                const totalEpisodes = anime.episodes || 12; 
                
                for(let i = 1; i <= totalEpisodes; i++) {
                    const btn = document.createElement('div');
                    btn.className = 'ep-btn';
                    btn.innerText = i;
                    // Prepare for Phase 3: Video Player Link
                    btn.onclick = () => { window.location.href = `player.html?id=${animeId}&ep=${i}`; };
                }

            } catch (error) {
                document.getElementById('detail-title').innerText = "Error loading details.";
            }
        }

        fetchDetails();
    </script>
</body>
</html>
