<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ani3Lix - Home</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 15px;
            text-align: left;
        }
        .header {
            font-size: 26px;
            font-weight: bold;
            color: #ff4757;
            text-align: center;
            margin-bottom: 20px;
        }
        .ad-banner {
            background-color: var(--tg-theme-secondary-bg-color, #2a2a2a);
            color: #777;
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            border-radius: 8px;
            font-size: 12px;
            border: 1px dashed #555;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin: 20px 0 10px 0;
            border-left: 4px solid #ff4757;
            padding-left: 8px;
        }
        .anime-scroll-row {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding-bottom: 10px;
            scrollbar-width: none;
        }
        .anime-scroll-row::-webkit-scrollbar { display: none; }
        .anime-card {
            min-width: 120px;
            max-width: 120px;
            background-color: var(--tg-theme-secondary-bg-color, #1e1e1e);
            border-radius: 8px;
            padding: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            cursor: pointer;
        }
        .anime-card img {
            width: 100%;
            border-radius: 6px;
            aspect-ratio: 2/3;
            object-fit: cover;
        }
        .anime-title {
            font-size: 13px;
            margin-top: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">Ani3Lix</div>

    <div class="ad-banner">Top Banner Ad Space</div>

    <div class="section-title">🔥 Top Trending</div>
    <div class="anime-scroll-row" id="trending-container">Loading...</div>

    <div class="section-title">📺 Currently Airing</div>
    <div class="anime-scroll-row" id="airing-container">Loading...</div>

    <div class="ad-banner">Mid-Page Banner Ad Space</div>

    <div class="section-title">✨ Upcoming Next Season</div>
    <div class="anime-scroll-row" id="upcoming-container">Loading...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        async function fetchAnimeCategory(apiUrl, containerId) {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                const container = document.getElementById(containerId);
                container.innerHTML = ''; 

                data.data.forEach(anime => {
                    const card = document.createElement('div');
                    card.className = 'anime-card';
                    
                    // NEW LOGIC: Redirect to details.html and pass the anime ID
                    card.onclick = () => {
                        window.location.href = `details.html?id=${anime.mal_id}`;
                    };

                    card.innerHTML = `
                        <img src="${anime.images.jpg.image_url}" alt="${anime.title}">
                        <div class="anime-title">${anime.title}</div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                document.getElementById(containerId).innerHTML = '<p>Error loading.</p>';
            }
        }

        fetchAnimeCategory('https://api.jikan.moe/v4/top/anime?filter=bypopularity&limit=10', 'trending-container');
        fetchAnimeCategory('https://api.jikan.moe/v4/seasons/now?limit=10', 'airing-container');
        fetchAnimeCategory('https://api.jikan.moe/v4/seasons/upcoming?limit=10', 'upcoming-container');
    </script>
</body>
</html>
