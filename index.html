<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ani3Lix</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* Automatically adapts to the user's Telegram Dark/Light mode */
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .header {
            font-size: 26px;
            font-weight: bold;
            color: #ff4757;
            margin-bottom: 20px;
        }
        
        /* Designated Ad Banner Zones */
        .ad-banner {
            background-color: var(--tg-theme-secondary-bg-color, #2a2a2a);
            color: #777;
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            border-radius: 8px;
            font-size: 12px;
            border: 1px dashed #555;
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .anime-card {
            background-color: var(--tg-theme-secondary-bg-color, #1e1e1e);
            border-radius: 8px;
            padding: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            cursor: pointer;
        }
        .anime-card img {
            width: 100%;
            border-radius: 6px;
            aspect-ratio: 2/3;
            object-fit: cover;
        }
        .anime-title {
            font-size: 13px;
            margin-top: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <div class="header">Ani3Lix</div>

    <div class="ad-banner" id="top-ad">Top Banner Ad Space (Ready for Ad Code)</div>

    <h3>Top Trending Anime</h3>
    
    <div class="anime-grid" id="anime-container">
        Loading...
    </div>

    <div class="ad-banner" id="bottom-ad">Bottom Banner Ad Space (Ready for Ad Code)</div>

    <script>
        // Tell Telegram the app is ready and expand it to full screen
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Fetch the top trending anime from an open API
        async function fetchTrending() {
            try {
                const response = await fetch('https://api.jikan.moe/v4/top/anime?limit=6');
                const data = await response.json();
                
                const container = document.getElementById('anime-container');
                container.innerHTML = ''; 

                data.data.forEach(anime => {
                    const card = document.createElement('div');
                    card.className = 'anime-card';
                    card.innerHTML = `
                        <img src="${anime.images.jpg.image_url}" alt="${anime.title}">
                        <div class="anime-title">${anime.title}</div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                document.getElementById('anime-container').innerHTML = '<p>Error loading anime. Please try again.</p>';
            }
        }

        fetchTrending();
    </script>
</body>
</html>
