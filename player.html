<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ani3Lix - Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .btn-back {
            background-color: var(--tg-theme-secondary-bg-color, #333);
            color: var(--tg-theme-text-color, #fff);
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            float: left; /* Aligns the back button to the top left */
        }
        .clearfix {
            clear: both;
        }
        .ad-banner {
            background-color: var(--tg-theme-secondary-bg-color, #2a2a2a);
            color: #777;
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            border-radius: 8px;
            font-size: 12px;
            border: 1px dashed #555;
        }
        .player-wrapper {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            margin-top: 20px;
        }
        video {
            width: 100%;
            border-radius: 8px;
            background-color: #000;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .ep-title {
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0 5px 0;
            color: #ff4757;
        }
        .anime-name {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <a id="back-btn" href="index.html" class="btn-back">← Back to Details</a>
    <div class="clearfix"></div>
    
    <div class="player-wrapper">
        <div class="ep-title" id="display-ep">Loading Episode...</div>
        <div class="anime-name" id="display-name">Please wait</div>

        <div class="ad-banner">Top Video Player Ad Space</div>

        <video id="video-player" controls playsinline autoplay>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <div class="ad-banner">Bottom Video Player Ad Space</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // 1. Extract the IDs we passed in the URL (e.g., ?id=21&ep=4)
        const urlParams = new URLSearchParams(window.location.search);
        const animeId = urlParams.get('id');
        const episodeNum = urlParams.get('ep');

        // 2. Set the Back Button to return to the exact show they were looking at
        if (animeId) {
            document.getElementById('back-btn').href = `details.html?id=${animeId}`;
        }

        // 3. Update the UI with the Episode Number
        if (episodeNum) {
            document.getElementById('display-ep').innerText = `Episode ${episodeNum}`;
        }

        // 4. Fetch the anime's title from the API to make the page look polished
        async function fetchAnimeName() {
            if (!animeId) return;
            try {
                const response = await fetch(`https://api.jikan.moe/v4/anime/${animeId}`);
                const data = await response.json();
                document.getElementById('display-name').innerText = data.data.title;
            } catch (error) {
                document.getElementById('display-name').innerText = "Unknown Anime";
            }
        }

        fetchAnimeName();
    </script>
</body>
</html>
