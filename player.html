<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ani3Lix - Premium Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <style>
        body { font-family: Arial, sans-serif; background-color: var(--tg-theme-bg-color, #121212); color: var(--tg-theme-text-color, #ffffff); margin: 0; padding: 15px; }
        .btn-back { background-color: var(--tg-theme-secondary-bg-color, #333); color: var(--tg-theme-text-color, #fff); border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-bottom: 15px; font-size: 14px; text-decoration: none; display: inline-block; }
        .player-wrapper { width: 100%; max-width: 800px; margin: 0 auto; border-radius: 10px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.6); position: relative; background-color: #000; }
        :root { --plyr-color-main: #ff4757; }
        .ep-title { font-size: 20px; font-weight: bold; margin: 15px 0 5px 0; color: #ff4757; }
        .anime-name { font-size: 14px; color: #ccc; margin-bottom: 15px; }
        .skip-button { position: absolute; bottom: 70px; right: 20px; background-color: rgba(0, 0, 0, 0.8); color: white; border: 1px solid #ff4757; padding: 10px 20px; border-radius: 6px; cursor: pointer; z-index: 10; display: none; font-weight: bold; font-size: 14px; transition: 0.2s ease-in-out; }
        .skip-button:hover { background-color: #ff4757; }
        .loading-text { color: #fff; padding: 40px; text-align: center; font-style: italic; line-height: 1.5; }
    </style>
</head>
<body>

    <a id="back-btn" href="index.html" class="btn-back">← Back</a>
    
    <div class="ep-title" id="display-ep">Loading Episode...</div>
    <div class="anime-name" id="display-name">Please wait...</div>

    <div class="player-wrapper" id="player-wrapper">
        <div id="loading-indicator" class="loading-text">Connecting to private engine...</div>
        <video id="video-player" controls crossorigin playsinline style="display:none;"></video>
        <button id="skip-btn" class="skip-button">Skip Intro</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const animeId = urlParams.get('id');
        const episodeNum = urlParams.get('ep');

        let skipTimes = { op: null, ed: null };
        const skipBtn = document.getElementById('skip-btn');
        const videoElement = document.getElementById('video-player');
        const loadingText = document.getElementById('loading-indicator');

        if (animeId) document.getElementById('back-btn').href = `details.html?id=${animeId}`;
        if (episodeNum) document.getElementById('display-ep').innerText = `Episode ${episodeNum}`;

        const KAI_API_URL = "https://animekai-api-k6jf.onrender.com"; 

        setTimeout(() => {
            if(loadingText.style.display !== 'none') {
                loadingText.innerText += "\n\n(Waking up the server, this might take up to 45 seconds...)";
            }
        }, 6000);

        async function fetchInitialData() {
            if (!animeId) return;
            try {
                // Using Vercel Proxy instead of AllOrigins
                const jikanRes = await fetch(`/api/proxy?url=` + encodeURIComponent(`https://api.jikan.moe/v4/anime/${animeId}`));
                const jikanData = await jikanRes.json();
                const animeTitle = jikanData.data.title;
                document.getElementById('display-name').innerText = animeTitle;

                try {
                    const coverImage = jikanData.data.images.jpg.large_image_url || jikanData.data.images.jpg.image_url;
                    let history = JSON.parse(localStorage.getItem('ani3lix_history')) || [];
                    history = history.filter(h => h.id !== animeId);
                    history.unshift({ id: animeId, title: animeTitle, image: coverImage, ep: episodeNum });
                    if (history.length > 15) history.pop();
                    localStorage.setItem('ani3lix_history', JSON.stringify(history));
                } catch (e) { console.log("History save failed"); }

                fetchNativeStream(animeTitle, episodeNum);

                fetch(`/api/proxy?url=` + encodeURIComponent(`https://api.aniskip.com/v2/skip-times/${animeId}/${episodeNum}?types=op&types=ed&episodeLength=0`))
                    .then(res => res.json())
                    .then(data => {
                        if (data.found) {
                            if (data.results.op) skipTimes.op = data.results.op.interval;
                            if (data.results.ed) skipTimes.ed = data.results.ed.interval;
                        }
                    }).catch(e => console.log("No skip times found."));

            } catch (error) {
                document.getElementById('display-name').innerText = "Data load failed.";
                loadingText.innerText = "Error loading anime metadata.";
            }
        }

        async function fetchNativeStream(title, epNum) {
            try {
                loadingText.innerText = "Searching database...";
                const searchRes = await fetch(`${KAI_API_URL}/api/search?keyword=${encodeURIComponent(title)}`);
                const searchData = await searchRes.json();
                if (!searchData || searchData.length === 0) throw new Error("Anime not found in database.");
                const slug = searchData[0].slug;

                loadingText.innerText = "Extracting ID...";
                const infoRes = await fetch(`${KAI_API_URL}/api/anime/${slug}`);
                const infoData = await infoRes.json();
                const aniId = infoData.ani_id;
                if (!aniId) throw new Error("Could not extract ID.");

                loadingText.innerText = "Finding episode token...";
                const epListRes = await fetch(`${KAI_API_URL}/api/episodes/${aniId}`);
                const epListData = await epListRes.json();
                
                const targetEp = epListData.find(e => parseInt(e.number) === parseInt(epNum));
                if (!targetEp) throw new Error(`Episode ${epNum} not found.`);
                const epToken = targetEp.token;

                loadingText.innerText = "Bypassing servers...";
                const serversRes = await fetch(`${KAI_API_URL}/api/servers/${epToken}`);
                const serversData = await serversRes.json();
                
                let linkId = null;
                if (serversData.softsub && serversData.softsub.length > 0) linkId = serversData.softsub[0].link_id;
                else if (serversData.sub && serversData.sub.length > 0) linkId = serversData.sub[0].link_id;
                else if (serversData.dub && serversData.dub.length > 0) linkId = serversData.dub[0].link_id;
                
                if (!linkId) throw new Error("No playable servers available.");

                loadingText.innerText = "Decrypting final stream...";
                const sourceRes = await fetch(`${KAI_API_URL}/api/source/${linkId}`);
                const sourceData = await sourceRes.json();

                if (!sourceData.sources || sourceData.sources.length === 0) throw new Error("Decryption failed. No stream returned.");

                const rawStreamUrl = sourceData.sources[0].file;
                
                // THE LEAD DEV FIX: Route through Vercel to bypass CORS blocks
                const safeStreamUrl = `/api/scrape?url=${encodeURIComponent(rawStreamUrl)}`;
                
                initializePlayer(safeStreamUrl);

            } catch (error) {
                loadingText.innerText = "Error: " + error.message;
                console.error(error);
            }
        }

        function initializePlayer(streamUrl) {
            loadingText.style.display = 'none';
            videoElement.style.display = 'block';

            let player;
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(streamUrl);
                hls.attachMedia(videoElement);
                player = new Plyr(videoElement, {
                    controls: ['play-large', 'rewind', 'play', 'fast-forward', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
                    settings: ['quality', 'speed'],
                    seekTime: 10
                });
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                videoElement.src = streamUrl;
                player = new Plyr(videoElement, { seekTime: 10 });
            }

            player.on('timeupdate', () => {
                const time = player.currentTime;
                if (skipTimes.op && time >= skipTimes.op.startTime && time <= skipTimes.op.endTime) {
                    skipBtn.style.display = 'block'; skipBtn.innerText = 'Skip Intro'; skipBtn.onclick = () => { player.currentTime = skipTimes.op.endTime; };
                } else if (skipTimes.ed && time >= skipTimes.ed.startTime && time <= skipTimes.ed.endTime) {
                    skipBtn.style.display = 'block'; skipBtn.innerText = 'Skip Ending'; skipBtn.onclick = () => { player.currentTime = skipTimes.ed.endTime; };
                } else {
                    skipBtn.style.display = 'none';
                }
            });
        }

        fetchInitialData();
    </script>
</body>
</html>
