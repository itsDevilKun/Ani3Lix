<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ani3Lix - Premium Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 15px;
        }
        .btn-back {
            background-color: var(--tg-theme-secondary-bg-color, #333);
            color: var(--tg-theme-text-color, #fff);
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }
        .ad-banner {
            background-color: var(--tg-theme-secondary-bg-color, #2a2a2a);
            color: #777;
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            border-radius: 8px;
            font-size: 12px;
            border: 1px dashed #555;
        }
        .player-wrapper {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-radius: 10px;
            overflow: hidden; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            position: relative; 
            background-color: #000;
        }
        :root { --plyr-color-main: #ff4757; }
        .ep-title {
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0 5px 0;
            color: #ff4757;
        }
        .anime-name {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 15px;
        }
        .skip-button {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            border: 1px solid #ff4757;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            z-index: 10;
            display: none; 
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s ease-in-out;
        }
        .skip-button:hover { background-color: #ff4757; }
        .loading-text {
            color: #fff;
            padding: 40px;
            text-align: center;
            font-style: italic;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <a id="back-btn" href="index.html" class="btn-back">← Back</a>
    
    <div class="ep-title" id="display-ep">Loading Episode...</div>
    <div class="anime-name" id="display-name">Please wait...</div>

    <div class="ad-banner">Top Video Player Ad Space</div>

    <div class="player-wrapper">
        <div id="loading-indicator" class="loading-text">Searching multi-provider streams via Anify...<br>Please wait a moment.</div>
        <video id="video-player" controls crossorigin playsinline style="display:none;"></video>
        <button id="skip-btn" class="skip-button">Skip Intro</button>
    </div>

    <div class="ad-banner">Bottom Video Player Ad Space</div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const animeId = urlParams.get('id');
        const episodeNum = urlParams.get('ep');

        let skipTimes = { op: null, ed: null };
        const skipBtn = document.getElementById('skip-btn');
        const videoElement = document.getElementById('video-player');
        const loadingText = document.getElementById('loading-indicator');

        if (animeId) document.getElementById('back-btn').href = `details.html?id=${animeId}`;
        if (episodeNum) document.getElementById('display-ep').innerText = `Episode ${episodeNum}`;

        async function fetchInitialData() {
            if (!animeId) return;
            try {
                const jikanRes = await fetch(`https://api.jikan.moe/v4/anime/${animeId}`);
                const jikanData = await jikanRes.json();
                const animeTitle = jikanData.data.title;
                document.getElementById('display-name').innerText = animeTitle;

                fetch(`https://api.aniskip.com/v2/skip-times/${animeId}/${episodeNum}?types=op&types=ed&episodeLength=0`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.found) {
                            if (data.results.op) skipTimes.op = data.results.op.interval;
                            if (data.results.ed) skipTimes.ed = data.results.ed.interval;
                        }
                    }).catch(e => console.log("No skip times found."));

                fetchAnifyStream(animeTitle, episodeNum);

            } catch (error) {
                document.getElementById('display-name').innerText = "Data load failed.";
                loadingText.innerText = "Error loading anime metadata.";
            }
        }

        // BULLETPROOF: The Anify Bridge
        async function fetchAnifyStream(title, epNum) {
            try {
                // Switching to a much more stable proxy
                const proxy = "/api/proxy?url=";

                // Step A: Search Anify
                const searchUrl = `https://api.anify.tv/search?query=${encodeURIComponent(title)}&type=anime`;
                const searchRes = await fetch(proxy + encodeURIComponent(searchUrl));
                
                if (!searchRes.ok) throw new Error(`Proxy/API error: ${searchRes.status}`);
                const searchData = await searchRes.json();
                
                // BULLETPROOF FIX: Check if the API returned an error object instead of an array
                if (searchData.error || searchData.message) {
                    throw new Error(searchData.error || searchData.message);
                }

                // Handle both array responses and object responses safely
                const searchResults = Array.isArray(searchData) ? searchData : (searchData.results || []);
                
                if (!searchResults || searchResults.length === 0) {
                    throw new Error("Anime not found in Anify database.");
                }
                const anifyId = searchResults[0].id; 

                // Step B: Get episodes
                const epUrl = `https://api.anify.tv/episodes/${anifyId}`;
                const epRes = await fetch(proxy + encodeURIComponent(epUrl));
                const epData = await epRes.json();
                
                const epResults = Array.isArray(epData) ? epData : (epData.episodes || []);
                if (!epResults || epResults.length === 0) {
                    throw new Error("No providers found for this anime.");
                }

                // Step C: Select a provider 
                const provider = epResults.find(p => p.episodes && p.episodes.length > 0) || epResults[0];
                if (!provider || !provider.episodes) throw new Error("No episodes found on provider.");

                const episode = provider.episodes.find(e => parseInt(e.number) === parseInt(epNum));
                if (!episode) throw new Error("Episode " + epNum + " not found.");

                // Step D: Fetch the raw streaming sources (.m3u8)
                const sourceUrl = `https://api.anify.tv/sources?providerId=${provider.providerId}&watchId=${encodeURIComponent(episode.id)}&episodeNumber=${epNum}&id=${anifyId}`;
                const sourceRes = await fetch(proxy + encodeURIComponent(sourceUrl));
                const sourceData = await sourceRes.json();

                if (!sourceData || !sourceData.sources || sourceData.sources.length === 0) {
                    throw new Error("No streamable video files found.");
                }

                // Grab the highest quality link
                const bestSource = sourceData.sources.find(s => s.quality === 'auto' || s.quality === '1080p') || sourceData.sources[0];

                // Fire up the player
                initializePlayer(bestSource.url);

            } catch (error) {
                loadingText.innerText = "Error: " + error.message;
                console.error(error);
            }
        }

        function initializePlayer(streamUrl) {
            loadingText.style.display = 'none';
            videoElement.style.display = 'block';

            let player;
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(streamUrl);
                hls.attachMedia(videoElement);
                player = new Plyr(videoElement, {
                    controls: ['play-large', 'rewind', 'play', 'fast-forward', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'fullscreen'],
                    settings: ['quality', 'speed'],
                    seekTime: 10
                });
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                videoElement.src = streamUrl;
                player = new Plyr(videoElement, { seekTime: 10 });
            }

            // Skip Button Overlay Logic
            player.on('timeupdate', () => {
                const time = player.currentTime;
                if (skipTimes.op && time >= skipTimes.op.startTime && time <= skipTimes.op.endTime) {
                    skipBtn.style.display = 'block';
                    skipBtn.innerText = 'Skip Intro';
                    skipBtn.onclick = () => { player.currentTime = skipTimes.op.endTime; };
                } else if (skipTimes.ed && time >= skipTimes.ed.startTime && time <= skipTimes.ed.endTime) {
                    skipBtn.style.display = 'block';
                    skipBtn.innerText = 'Skip Ending';
                    skipBtn.onclick = () => { player.currentTime = skipTimes.ed.endTime; };
                } else {
                    skipBtn.style.display = 'none';
                }
            });
        }

        fetchInitialData();
    </script>
</body>
</html>
